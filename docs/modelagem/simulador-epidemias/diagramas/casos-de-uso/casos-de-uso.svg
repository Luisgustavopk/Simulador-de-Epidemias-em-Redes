">e topologia da rede</text></g><!--entity Parametros--><g class="entity" data-entity="Parametros" data-source-line="14" data-uid="ent0006" id="entity_Parametros"><ellipse cx="573.9436" cy="741.6637" fill="#F1F1F1" rx="198.527" ry="43.9554" style="stroke:#555555;stroke-width:0.8854;"/><text fill="#000000" font-family="Arial" font-size="24.7917" lengthAdjust="spacing" textLength="296.241" x="425.8231" y="739.1608">Configurar par&#226;metros SIR</text><text fill="#000000" font-family="Arial" font-size="24.7917" lengthAdjust="spacing" textLength="213.5981" x="467.1446" y="767.6688">e condi&#231;&#245;es iniciais</text></g><!--entity Isolamento--><g class="entity" data-entity="Isolamento" data-source-line="15" data-uid="ent0007" id="entity_Isolamento"><ellipse cx="574.17" cy="277.9277" fill="#F1F1F1" rx="239.4825" ry="52.1465" style="stroke:#555555;stroke-width:0.8854;"/><text fill="#000000" font-family="Arial" font-size="24.7917" lengthAdjust="spacing" textLength="378.9324" x="384.7038" y="272.7146">Configurar estrat&#233;gia, mecanismo,</text><text fill="#000000" font-family="Arial" font-size="24.7917" lengthAdjust="spacing" textLength="363.8129" x="392.2636" y="301.2226">or&#231;amento e in&#237;cio do isolamento</text></g><!--entity Executar--><g class="entity" data-entity="Executar" data-source-line="16" data-uid="ent0008" id="entity_Executar"><ellipse cx="574.0149" cy="880.3342" fill="#F1F1F1" rx="134.8482" ry="31.2196" style="stroke:#555555;stroke-width:0.8854;"/><text fill="#000000" font-family="Arial" font-size="24.7917" lengthAdjust="spacing" textLength="216.3339" x="465.8479" y="888.3903">Executar simula&#231;&#227;o</text></g><!--entity Comparar--><g class="entity" data-entity="Comparar" data-source-line="17" data-uid="ent0009" id="entity_Comparar"><ellipse cx="573.4272" cy="1016.2001" fill="#F1F1F1" rx="165.2501" ry="43.1272" style="stroke:#555555;stroke-width:0.8854;"/><text fill="#000000" font-family="Arial" font-size="24.7917" lengthAdjust="spacing" text