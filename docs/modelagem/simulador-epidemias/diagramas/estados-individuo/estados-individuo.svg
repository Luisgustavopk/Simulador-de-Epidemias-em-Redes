<text x="440.0" y="879.5" font-family="Arial, sans-serif" font-size="30" font-weight="700" text-anchor="middle" fill="#282828">Recuperado ou</text>
<text x="440.0" y="916.5" font-family="Arial, sans-serif" font-size="30" font-weight="700" text-anchor="middle" fill="#282828">removido (R)</text>
