<text x="264" y="218" font-family="Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#282828">Condição epidemiológica</text>
<text x="296" y="253" font-family="Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#777">Suscetível → Infectado → Recuperado</text>
<text x="1060" y="218" font-family="Arial, sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#282828">Condição de isolamento</text>
<text x="1090" y="253" font-family="Arial, sans-serif" font-size="21" font-weight="400" text-anchor="start" fill="#777">Uma condição independente do SIR</text>
<circle cx="440" cy="298" r="17" fill="#222"/>
<path d="M440,315 V352" fill="none" stroke="#303030" stroke-width="3" marker-end="url(#seta)"/>
