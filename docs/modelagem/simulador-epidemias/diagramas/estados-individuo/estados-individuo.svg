<text x="270" y="475" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#282828">[demais]</text>
<path d="M468,380 H762 Q776,380 776,394 V710 H573" fill="none" stroke="#303030" stroke-width="3" marker-end="url(#seta)"/>
<text x="506" y="440" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#282828">[infectado inicial]</text>
<text x="506" y="471" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#282828">/ infectar(0)</text>
<rect x="310" y="501" width="260" height="73" rx="20" fill="#f6f6f6" stroke="#666" stroke-width="2"/>
<text x="440.0" y="547.5" font-family="Arial, sans-serif" font-size="30" font-weight="700" text-anchor="middle" fill="#282828">Suscetível (S)</text>
<path d="M440,574 V678" fill="none" stroke="#303030" stroke-width="3" marker-end="url(#seta)"/>
<text x="70" y="614" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#282828">atualização [infecção]</text>
<text x="70" y="645" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#282828">/ infectar(t+1)</text>
<rect x="307" y="678" width="266" height="73" rx="20" fill="#f6f6f6" stroke="#666" stroke-width="2"/>
<text x="440.0" y="724.5" font-family="Arial, sans-serif" font-size="30" font-weight="700" text-anchor="middle" fill="#282828">Infectado (I)</text>
<path d="M440,751 V851" fill="none" stroke="#303030" stroke-width="3" marker-end="url(#seta)"/>
<text x="70" y="786" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#282828">atualização [recuperação]</text>
<text x="70" y="817" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#282828">/ recuperar()</text>
