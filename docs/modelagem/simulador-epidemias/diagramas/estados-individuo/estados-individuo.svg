<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1130" viewBox="0 0 1600 1130">
<defs><marker id="seta" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,3 L0,6 Z" fill="#282828"/></marker></defs>
<rect width="1600" height="1130" fill="white"/>
<text x="40" y="56" font-family="Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#666">SIMULADOR DE EPIDEMIAS EM REDES · UML</text>
