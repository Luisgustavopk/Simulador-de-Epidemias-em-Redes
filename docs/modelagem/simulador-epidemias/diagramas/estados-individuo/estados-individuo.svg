45;es independentes e simult&#226;neas.</text><text fill="#000000" font-family="Arial" font-size="23.0208" lengthAdjust="spacing" textLength="267.4373" x="21.25" y="1494.8358">Isolar n&#227;o altera S, I ou R.</text><text fill="#000000" font-family="Arial" font-size="23.0208" lengthAdjust="spacing" textLength="652.6092" x="21.25" y="1521.3075">Efeito conforme mecanismo: desativa&#231;&#227;o, redu&#231;&#227;o ou exclus&#227;o.</text><text fill="#000000" font-family="Arial" font-size="23.0208" lengthAdjust="spacing" textLength="539.9779" x="21.25" y="1547.7792">Passar para R n&#227;o exclui automaticamente o v&#233;rtice.</text><text fill="#000000" font-family="Arial" font-size="23.0208" lengthAdjust="spacing" textLength="675.6525" x="21.25" y="1574.2509">Na coorte fechada, a exclus&#227;o preserva o registro epidemiol&#243;gico.</text><text fill="#000000" font-family="Arial" font-size="23.0208" lengthAdjust="spacing" textLength="464.5307" x="21.25" y="1600.7227">Sem libera&#231;&#227;o na configura&#231;&#227;o de refer&#234;ncia.</text><text fill="#000000" font-family="Arial" font-size="23.0208" lengthAdjust="spacing" textLength="505.3905" x="21.25" y="1627.1944">Transi&#231;&#245;es SIR usam os estados existentes em t.</text></g><!--SRC=[VLHHQzH047w_Np7eIwkzOXz4AAMWfOK3AILHNsefqytaRcYo4tOtrwhqp-Y3AFH9_0NvOyvkShrS5U-utExCz-tiV3EJ1HS4L3VX4nJaZUCciDY9lsRReCCQQh5Y5avgWk1Q6dcAXc7lrOkHnI-ma1ksSoYnyXjOAh6jmedOS8fwr6l7M8tyLsYkvqvQMnn99Gvk5Xp6V1ymq9j7eASdU_7x5qnSGMw0l4oVINB0avajUDdT5wqy0VIGjgmx-3816317ejRkU_TDW1fLfsQfkbzpDfWunokRp1aJRymiUTuwxDbisMYMGoHT2nmSc8MmeSF3CIzllQ7GtI-fWgryEn7oCM1cIp91jOMjMU-UZTqPcROX5_tIWgDQD2d5PZqsIzZpPnSmdHuEDqccuLB92ljmpWzXXgjVF8Rb4QRf8tl5hBJqFIv_E0b3YnL_7dG8eERmVE-ZFNz_kTmAst00Psand9zusVzu7rQyETOrNXQHUAU_wVIVTTEMPY-LDfeDVQMJqw3C7ioRfJjD1OlEeYUyvQMZZHgCdCDwGzSr8QrwBNgSPiQskuyYwgP1xpMvIxP1Crkh29ugKenLHf_VtSIAXhwI4AG6ATVzgkwCvjpzfbG7QaWVDkYEm7EjazPzjOH-Lu7f4Wvip12he7q2-OwAhgsIHVznIQno66rUSJgQDHcqx6lPZsy43Bpiwx6ZdLMqlS3AfLjJjLutyOmppKbZn27KGgPGoS-