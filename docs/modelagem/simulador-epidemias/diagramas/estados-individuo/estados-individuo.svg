<path d="M1258,316 V508" fill="none" stroke="#303030" stroke-width="3" marker-end="url(#seta)"/>
<rect x="1122" y="508" width="272" height="75" rx="20" fill="#f6f6f6" stroke="#666" stroke-width="2"/>
<text x="1258.0" y="555.5" font-family="Arial, sans-serif" font-size="30" font-weight="700" text-anchor="middle" fill="#282828">Não isolado</text>
<path d="M1258,583 V792" fill="none" stroke="#303030" stroke-width="3" marker-end="url(#seta)"/>
<text x="965" y="674" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#282828">início em t_int</text>
<text x="965" y="705" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#282828">[selecionado] / isolar()</text>
<rect x="1151" y="792" width="214" height="75" rx="20" fill="#f6f6f6" stroke="#666" stroke-width="2"/>
<text x="1258.0" y="839.5" font-family="Arial, sans-serif" font-size="30" font-weight="700" text-anchor="middle" fill="#282828">Isolado</text>
<text x="1258" y="908" font-family="Arial, sans-serif" font-size="21" font-weight="400" text-anchor="middle" fill="#777">Alvos fixos, sem substituição</text>
<rect x="40" y="979" width="1520" height="133" rx="20" fill="#f6f6f6" stroke="#ddd" stroke-width="2"/>
<text x="70" y="1016" font-family="Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#666">CONVENÇÃO ADOTADA NESTA VERSÃO</text>
<text x="70" y="1054" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#282828">A recuperação preserva o isolamento, mantido até o encerramento da execução.</text>
<text x="70" y="1091" font-family="Arial, sans-serif" font-size="24" font-weight="400" text-anchor="start" fill="#282828">Decisões epidemiológicas usam o estado em t e são efetivadas juntas em t+1.</text>
</svg>