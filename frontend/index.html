<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#e9ede5" />
    <script>
      // Aplicar antes do primeiro desenho; a preferência é salva por useTema.
      let temaInicial
      try {
        temaInicial = localStorage.getItem('observatorio-tema')
      } catch {
        // A interface continua disponível quando o armazenamento é bloqueado.
      }
      document.documentElement.dataset.theme =
        temaInicial === 'light' || temaInicial === 'dark'
          ? temaInicial
          : window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light'
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Observatório · Epidemias em Redes</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
